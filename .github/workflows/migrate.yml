name: Database migrations
on:
  push:
    branches: [dev]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
    inputs:
      target:
        description: Target environment
        type: choice
        options: [development, production]
        default: development
permissions:
  contents: read
concurrency:
  group: database-${{ inputs.target || 'development' }}
  cancel-in-progress: false
jobs:
  migrate:
    if: vars.ENABLE_DATABASE_MIGRATIONS == 'true'
    environment: ${{ inputs.target || 'development' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment branch
        env:
          TARGET: ${{ inputs.target || 'development' }}
        run: |
          if [ "$TARGET" = production ]; then test "$GITHUB_REF" = refs/heads/main; else test "$GITHUB_REF" = refs/heads/dev; fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply reviewed migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_DB_PASSWORD" && test -n "$SUPABASE_PROJECT_ID"
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"
          pnpm exec supabase db push
