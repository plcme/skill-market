name: Brewdex release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brewdex-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build:cloudflare
      - run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build
          path: |
            .open-next
            .wrangler/dry-run
          include-hidden-files: true
          retention-days: 7
      - name: Deploy release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const token = (process.env.CLOUDFLARE_API_TOKEN || '').trim();
          if (!token || /\s/.test(token)) throw new Error('Deployment token contains unexpected whitespace; replace the repository secret with the token value only.');
          process.env.CLOUDFLARE_API_TOKEN = token;
          const result = spawnSync('pnpm', ['deploy:cloudflare'], { stdio: 'inherit', env: process.env });
          process.exit(result.status ?? 1);
          JS
      - name: Check production gate
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl --fail --retry 5 --retry-delay 5 https://brewdex.app/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' https://brewdex.app/)" = 303
          test "$(curl -s -o /dev/null -w '%{http_code}' https://brewdex.app/api/private)" = 401
