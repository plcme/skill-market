name: Brewdex release
on:
  # Production deploys only from a pushed v* tag. Pushes to main do not deploy.
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brewdex-release
  cancel-in-progress: false
jobs:
  build:
    env:
      APP_NAME: Brewdex
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build:cloudflare
      - run: pnpm exec wrangler deploy --dry-run --outfile .wrangler/worker.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build
          path: |
            .open-next/assets
            .wrangler/worker.bundle
          include-hidden-files: true
          retention-days: 7
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: cloudflare-build
      - name: Check release tag
        id: release
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main; refusing to deploy."
            exit 1
          fi
          echo "Release: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
      - name: Deploy Brewdex
        if: steps.release.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-brewdex.mjs
      - name: Check production pages
        if: steps.release.outputs.deploy == 'true'
        run: |
          # `/` is a redirect to the board (no -L: the redirect itself is what's checked); the board must load.
          # The edge can serve the previous version for a short while after deploy, so poll before failing.
          for attempt in $(seq 1 12); do
            root=$(curl --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code} %{redirect_url}' "https://brewdex.app/")
            [ "$root" = "307 https://brewdex.app/market" ] && break
            sleep 10
          done
          if [ "$root" != "307 https://brewdex.app/market" ]; then
            echo "::error::/ should be a 307 to /market, got: $root"
            exit 1
          fi
          status=$(curl --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "https://brewdex.app/market")
          if [ "$status" != 200 ]; then
            echo "::error::/market returned $status"
            exit 1
          fi
          echo 'Live site: https://brewdex.app — public pages verified' >> "$GITHUB_STEP_SUMMARY"
