name: Brewdex release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brewdex-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build:cloudflare
      - run: pnpm exec wrangler deploy --dry-run --outfile .wrangler/worker.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build
          path: |
            .open-next/assets
            .wrangler/worker.bundle
          include-hidden-files: true
          retention-days: 7
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-build
      - name: Prepare release tag
        id: release
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            git fetch origin main --tags
            if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              echo 'A newer main commit exists; skip this superseded release.'
              echo 'deploy=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag=$(git tag --points-at "$GITHUB_SHA" --list 'v*' | sort -V | tail -1)
            if [ -z "$tag" ]; then
              tag=$(node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const tags = execFileSync('git', ['tag', '--list'], { encoding: 'utf8' }).trim().split('\n');
          const versions = tags.filter(t => /^v\d+\.\d+\.\d+$/.test(t)).map(t => t.slice(1).split('.').map(Number));
          versions.sort((a,b) => a[0]-b[0] || a[1]-b[1] || a[2]-b[2]);
          const [major,minor,patch] = versions.at(-1) || [0,1,0];
          console.log(`v${major}.${minor}.${patch + 1}`);
          JS
              )
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi
            echo "Release: $tag" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
      - name: Deploy Brewdex
        if: steps.release.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-brewdex.mjs
      - name: Check production gate
        if: steps.release.outputs.deploy == 'true'
        run: |
          curl --fail --retry 5 --retry-delay 5 https://brewdex.app/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' https://brewdex.app/)" = 303
          test "$(curl -s -o /dev/null -w '%{http_code}' https://brewdex.app/api/private)" = 401
          echo 'Live site: https://brewdex.app — invite gate verified' >> "$GITHUB_STEP_SUMMARY"
