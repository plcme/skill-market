name: Cloudflare deployment permissions check
on:
  push:
    branches: ['codex/brewdex-cloudflare']
    paths: ['.github/workflows/cloudflare-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment metadata endpoints without logging configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const base = 'https://api.cloudflare.com/client/v4/accounts/b1eb3d7d03b40f01f9e9c3ef18cf00d5';
          const paths = [
            '/workers/services/brewdex/environments/production/bindings',
            '/workers/services/brewdex/environments/production/routes?show_zonename=true',
            '/workers/domains/records?page=0&per_page=5&service=brewdex&environment=production',
            '/workers/services/brewdex/environments/production/subdomain',
            '/workers/services/brewdex/environments/production',
            '/workers/scripts/brewdex/schedules'
          ];
          for (const path of paths) {
            const res = await fetch(base + path, { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN.trim()}` } });
            const body = await res.json();
            console.log(JSON.stringify({path,status:res.status,success:body.success,errors:body.errors?.map(e=>({code:e.code,message:e.message}))}));
          }
          JS
